[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autogen-scavio"
version = "0.7.0"
description = "AutoGen integration for the Scavio API -- 188 real-time data tools across 31 platforms (Google, Amazon, Walmart, eBay, Target, Home Depot, Zillow, Redfin, Booking, Airbnb, Tripadvisor, Yelp, Indeed, Glassdoor, G2, Capterra, App Store, Google Play, SEC EDGAR, Companies House, Google Ads, Meta Ad Library, YouTube, TikTok, TikTok Shop, Instagram, Threads, Kuaishou, X, LinkedIn, Reddit) plus extract, which reads any URL as clean Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Scavio" }]
keywords = [
    "autogen",
    "ag2",
    "search",
    "ai",
    "agents",
    "web-search",
    "web-scraping",
    "scavio",
    "amazon-search",
    "walmart-search",
    "ebay-api",
    "zillow-api",
    "redfin-api",
    "booking-api",
    "airbnb-api",
    "yelp-api",
    "indeed-api",
    "glassdoor-api",
    "g2-api",
    "app-store-api",
    "google-play-api",
    "sec-edgar-api",
    "google-ads-transparency",
    "meta-ad-library",
    "youtube-search",
    "reddit-search",
    "tiktok-search",
    "instagram-search",
    "threads-api",
    "kuaishou-api",
    "x-search",
    "twitter-search",
    "linkedin-search",
    "url-extract",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

dependencies = [
    # 0.15.0 is the floor, not a preference: it is the first release carrying the
    # 21 new namespaces and the top-level extract() this package wraps. Resolving
    # an older scavio makes every tool below fail at import.
    "scavio>=0.15.0",
    "autogen-core>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://scavio.dev?utm_source=autogen_integration"
Repository = "https://github.com/scavio-ai/autogen-scavio"
Documentation = "https://scavio.dev/docs/autogen?utm_source=autogen_integration"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
